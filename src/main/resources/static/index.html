<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Обработка обращений</title>
    <link rel="stylesheet" href="/styles.css?v=20261025-1">
</head>
<body class="entry">
<main class="entry-box">
    <span class="brand-mark">ОО</span>
    <p>Вход…</p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/auth.js?v=20261025-1"></script>
<script src="/common.js?v=20261025-1"></script>
<script>
    // Вход и распределение по ролям: клиента в кабинет, сотрудника на рабочее место,
    // администратора в администрирование
    auth.init()
        .then(() => api("/api/me"))
        .then(me => window.location.replace(homeFor(me)))
        .catch(error => showToast(`Не удалось войти: ${error.message}`, true));
</script>
</body>
</html>
