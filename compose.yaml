name: insurance-appeals

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: insurance_appeals
      POSTGRES_USER: appeals
      POSTGRES_PASSWORD: appeals_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeals -d insurance_appeals"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    hostname: insurance-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: appeals
      RABBITMQ_DEFAULT_PASS: appeals_dev
      RABBITMQ_DEFAULT_VHOST: appeals
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Эмулятор учётной системы договоров страховой: отвечает по docs/contracts-api.yaml
  contracts-stub:
    image: wiremock/wiremock:3.13.2-alpine
    volumes:
      - ./stubs/contracts:/home/wiremock:ro
    ports:
      - "18081:8080"

  # Поставщик идентификации страховой: в стенде — Keycloak, реалм из keycloak/insurer-realm.json
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      # адрес, каким Keycloak видит браузер; он же издатель (iss) в токенах
      KC_HOSTNAME: http://localhost:18082
      # подсистема забирает ключи по внутреннему адресу keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance_appeals
      SPRING_DATASOURCE_USERNAME: appeals
      SPRING_DATASOURCE_PASSWORD: appeals_dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: appeals
      SPRING_RABBITMQ_PASSWORD: appeals_dev
      SPRING_RABBITMQ_VIRTUAL_HOST: appeals
      ATTACHMENT_STORAGE_PATH: /data/attachments
      CONTRACTS_BASE_URL: http://contracts-stub:8080
      IDP_ISSUER_URI: http://localhost:18082/realms/insurer
      IDP_JWK_SET_URI: http://keycloak:8080/realms/insurer/protocol/openid-connect/certs
    ports:
      - "18080:8080"
    volumes:
      - attachment-data:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      contracts-stub:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  attachment-data:
