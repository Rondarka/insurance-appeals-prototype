spring:
  application:
    name: insurance-appeals
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/insurance_appeals}
    username: ${SPRING_DATASOURCE_USERNAME:appeals}
    password: ${SPRING_DATASOURCE_PASSWORD:appeals_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        # outbox, эскалация и привязка договоров не ждут друг друга, если внешняя система висит
        size: 3
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:appeals}
    password: ${SPRING_RABBITMQ_PASSWORD:appeals_dev}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:appeals}
    # событие из outbox помечается отправленным только после подтверждения брокера
    publisher-confirm-type: simple
    # брокер недоступен: ретранслятор outbox не должен висеть на соединении
    connection-timeout: 3s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 500ms
          max-attempts: 3
          multiplier: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # издатель: поставщик идентификации страховой, каким его видит браузер;
          # в токене поле iss должно совпасть с этим адресом
          issuer-uri: ${IDP_ISSUER_URI:http://localhost:18082/realms/insurer}
          # открытые ключи для проверки подписи; в compose: по внутреннему адресу IdP
          jwk-set-uri: ${IDP_JWK_SET_URI:http://localhost:18082/realms/insurer/protocol/openid-connect/certs}
          # токен должен быть выпущен для подсистемы
          audiences: insurance-appeals

# метрики (решение 47): в compose на отдельном порту 8081, который не публикуется наружу,
# его читает только Prometheus во внутренней сети
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: insurance-appeals
    distribution:
      # гистограммы для p95 в Prometheus: время ответа API и задержка маршрутизации
      percentiles-histogram:
        http.server.requests: true
        appeals.routing.lag: true

server:
  port: 8080

appeals:
  # часовой пояс страховой: от него зависит, каким днём зарегистрировано обращение
  timezone: Europe/Moscow
  calendar:
    # каталог с файлами утверждённого производственного календаря
    path: ${CALENDAR_PATH:calendar}
  demo:
    # демонстрационные обращения для стенда и скриншотов (решение 33); на стенде включается в compose
    enabled: false
    count: 300
    days: 180
    seed: 2027
  outbox:
    # доставка событий из outbox в RabbitMQ (решение 3)
    initial-delay: PT1S
    interval: PT0.5S
    batch-size: 100
    # отправленные события хранятся неделю, затем удаляются
    retention: P7D
    cleanup-interval: PT1H
  contract-link:
    # фоновая привязка договора, если при регистрации учётная система была недоступна
    initial-delay: PT20S
    interval: PT1M
    max-backoff: PT1H
  retention:
    # раз в сутки обезличивать обращения, у которых истёк срок хранения (решение 41)
    initial-delay: PT5M
    interval: PT24H
  escalation:
    # за сколько рабочих дней до срока по закону предупреждать и как часто проверять
    warn-working-days: 2
    initial-delay: PT30S
    interval: PT5M
  attachments:
    path: ${ATTACHMENT_STORAGE_PATH:/data/attachments}
    # за один раз (форма обращения или сообщение) и всего у обращения
    max-count: 5
    max-per-appeal: 30
    # антивирус ClamAV (решение 39); адрес не задан, значит проверка выключена
    antivirus:
      host: ${ANTIVIRUS_HOST:}
      port: 3310
      timeout: PT10S
  auth:
    # публичный клиент OAuth, через который входит интерфейс (код авторизации + PKCE)
    ui-client-id: appeals-ui
  assistant:
    # локальная модель помощника сотрудника (решение 35); включает администратор на вкладке «Правила»
    model:
      # OpenAI-совместимый API в контуре страховой: Ollama, LM Studio, vLLM. Внешние сервисы не подключать:
      # в запросе текст обращения: персональные данные
      base-url: ${ASSISTANT_MODEL_URL:http://localhost:11434/v1}
      name: ${ASSISTANT_MODEL:qwen2.5:7b-instruct}
      timeout: 30s
      api-key: ${ASSISTANT_MODEL_KEY:}
      # после серии сбоев к модели не обращаемся, подсказки дают правила
      open-duration: PT1M
  contracts:
    # учётная система договоров страховой; в стенде: заглушка WireMock
    base-url: ${CONTRACTS_BASE_URL:http://localhost:18081}
    # кабинет не ждёт дольше 2–3 с: таймаут и один быстрый повтор, дальше резервный режим (решение 30)
    timeout: 1s
    retry:
      max-attempts: 2
      pause: PT0.2S
    circuit:
      # если из последних 10 вызовов (не меньше 5) сбоем закончилась половина, 30 с к системе не обращаемся
      sliding-window: 10
      minimum-calls: 5
      failure-rate-threshold: 50
      open-duration: PT30S

logging:
  level:
    ru.mtuci.appeals: INFO
