name: insurance-appeals

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: insurance_appeals
      POSTGRES_USER: appeals
      POSTGRES_PASSWORD: appeals_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeals -d insurance_appeals"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    hostname: insurance-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: appeals
      RABBITMQ_DEFAULT_PASS: appeals_dev
      RABBITMQ_DEFAULT_VHOST: appeals
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Эмулятор учётной системы договоров страховой: отвечает по docs/contracts-api.yaml
  contracts-stub:
    image: wiremock/wiremock:3.13.2-alpine
    volumes:
      - ./stubs/contracts:/home/wiremock:ro
    ports:
      - "18081:8080"

  # Поставщик идентификации страховой; в стенде это Keycloak, реалм из keycloak/insurer-realm.json
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
      # адрес, каким Keycloak видит браузер; он же издатель (iss) в токенах
      KC_HOSTNAME: http://localhost:18082
      # подсистема забирает ключи по внутреннему адресу keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      # тема страницы входа в стиле страховой (решение 45)
      - ./keycloak/themes/insurer:/opt/keycloak/themes/insurer:ro
    ports:
      - "18082:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Антивирус для вложений (решение 39). Тяжёлый: базы сигнатур около 300 МБ и до 2 ГБ памяти,
  # поэтому поднимается только по запросу:
  #   ANTIVIRUS_HOST=clamav docker compose --profile antivirus up --build
  clamav:
    image: clamav/clamav:1.5.3
    profiles: ["antivirus"]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 20

  app:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance_appeals
      SPRING_DATASOURCE_USERNAME: appeals
      SPRING_DATASOURCE_PASSWORD: appeals_dev
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: appeals
      SPRING_RABBITMQ_PASSWORD: appeals_dev
      SPRING_RABBITMQ_VIRTUAL_HOST: appeals
      ATTACHMENT_STORAGE_PATH: /data/attachments
      CONTRACTS_BASE_URL: http://contracts-stub:8080
      IDP_ISSUER_URI: http://localhost:18082/realms/insurer
      IDP_JWK_SET_URI: http://keycloak:8080/realms/insurer/protocol/openid-connect/certs
      CALENDAR_PATH: /data/calendar
      # демонстрационные обращения за полгода: один раз, если их ещё нет (решение 33)
      APPEALS_DEMO_ENABLED: "true"
      # локальная модель помощника на компьютере со стендом, например Ollama (решение 35);
      # включает администратор на вкладке «Правила», без модели подсказки дают правила
      ASSISTANT_MODEL_URL: ${ASSISTANT_MODEL_URL:-http://host.docker.internal:11434/v1}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:7b-instruct}
      # антивирус для вложений (решение 39); пусто, значит проверка выключена
      ANTIVIRUS_HOST: ${ANTIVIRUS_HOST:-}
      # метрики на отдельном порту, он не публикуется: их забирает только Prometheus (решение 47)
      MANAGEMENT_SERVER_PORT: "8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18080:8080"
    volumes:
      - attachment-data:/data/attachments
      - ./calendar:/data/calendar:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      contracts-stub:
        condition: service_started
      keycloak:
        condition: service_started

  # Мониторинг (решение 47), поднимается по запросу:
  #   docker compose --profile monitoring up -d
  # Prometheus: http://localhost:19090, Grafana: http://localhost:13000 (панель открывается сразу)
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "19090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_dev
      # смотреть панель можно без входа, менять нельзя
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/appeals.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "13000:3000"
    depends_on:
      - prometheus

  # Нагрузочный тест, запускается вручную:
  #   docker compose run --rm k6 run /scripts/appeals.js
  k6:
    image: grafana/k6:2.2.0
    profiles: ["load"]
    volumes:
      - ./load:/scripts
    environment:
      APP_URL: http://app:8080
      KEYCLOAK_URL: http://keycloak:8080

volumes:
  postgres-data:
  rabbitmq-data:
  attachment-data:
  prometheus-data:
  grafana-data:
